site_name: digital garden
site_url: https://truly-tranquil.github.io/digital-garden/
docs_dir: docs
site_dir: site

theme:
  name: null
  custom_dir: my-garden-theme
  static_templates:
    - 404.html
    - search.html

hooks:
  - hooks.py

exclude_docs: |
  **/drafts/**
  **/draft-*.md
  **/templates/**
  **/*template*.md
  **/.obsidian/**

plugins:
  - search
  - callouts

extra:
  feed: feed.xml
  og_image: assets/og-image.png

validation:
  nav:
    omitted_files: info
  links:
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - nl2br
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - pymdownx.saneheaders
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "¶"
      permalink_title: "Link to this section"
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true

nav:
  - home: index.md
  - manifesto: manifesto.md
  - about: about.md
  - seedlings:
      - map of contents: seedlings/index.md
      - test note 1: seedlings/test-note-1.md
      - test note 2: seedlings/test-note-2.md
  - buds:
      - map of contents: buds/index.md
  - evergreens:
      - map of contents: evergreens/index.md
  - by tag:
      - map of contents: by-tag/index.md
  - for my reference:
    - reference page: for-my-reference/reference-page.md