site_name: digital garden
site_url: https://truly-tranquil.github.io/digital-garden/
docs_dir: docs
site_dir: site

theme:
  name: null
  custom_dir: my-garden-theme
  static_templates:
    - 404.html
    - search.html

hooks:
  - hooks.py

exclude_docs: |
  **/drafts/**
  **/draft-*.md
  **/templates/**
  **/*template*.md
  **/.obsidian/**

plugins:
  - search
  - callouts
  - redirects
  - minify:
      htmlmin_opts:
        remove_comments: true
  - git-revision-date-localized:
      type: date
      timezone: America/New_York
  - awesome-pages:
      filename: .pages
  - glightbox
  - mermaid2:
      version: 10.9.1
  - macros
  - table-reader
  - roamlinks
  - htmlproofer
  - mkdocs-video
  - material/tags
  - print-site

extra:
  feed: feed.xml
  og_image: assets/og-image.png

validation:
  nav:
    omitted_files: info
  links:
    anchors: warn
    unrecognized_links: warn

nav:
  - home: index.md
  - manifesto: manifesto.md
  - about: about.md
  - seedlings:
      - index: seedlings/index.md
  - buds:
      - index: buds/index.md
  - evergreens:
      - index: evergreens/index.md

markdown_extensions:
  - nl2br
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr
  - pymdownx.saneheaders
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "¶"
      permalink_title: "Link to this section"
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true

