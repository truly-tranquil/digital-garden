name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 09:17 UTC = 01:17 PST / 02:17 PDT, so the rebuild lands between
    # midnight and 4am Pacific year-round.
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so git-derived planted/tended dates are correct
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python validate_frontmatter.py
      - run: python garden_build.py
        env:
          GARDEN_BASE_PATH: /digital-garden
      - run: python check_site.py dist --base-path /digital-garden
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
