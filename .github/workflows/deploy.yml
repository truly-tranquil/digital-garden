# .github/workflows/deploy.yml
name: Deploy Garden (Zensical)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Zensical — use the official install method
      # Option 1: Cargo (if published on crates.io)
      - name: Install Zensical (cargo)
        run: cargo install zensical --locked
        # Option 2: Prebuilt binary (if releases exist)
        # - name: Install Zensical (binary)
        #   run: |
        #     curl -LsSf https://github.com/your-org/zensical/releases/latest/download/zensical-x86_64-unknown-linux-gnu.tar.gz | tar xz
        #     echo "$(pwd)" >> $GITHUB_PATH

      # Build the site
      - name: Build site
        run: zensical build
        # Expected output: ./site/

      # GitHub Pages marker (required for Pages to serve _files)
      - name: Include GitHub Pages marker
        run: touch site/.nojekyll

      # Link checking — SOURCE markdown (catches broken refs early)
      - name: Check links (source Markdown)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-mail 'docs/**/*.md'

      # Link checking — BUILT output (catches generated bad links)
      - name: Check links (built site)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline site

      # Accessibility + performance audit (keep — still valuable)
      - name: Audit accessibility
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true

      # Upload artifact for deployment
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4