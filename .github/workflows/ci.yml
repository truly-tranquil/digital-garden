name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so git-derived planted/tended dates are correct
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy garden garden_build.py validate_frontmatter.py check_site.py
      - run: python validate_frontmatter.py
      - run: python garden_build.py
        env:
          GARDEN_BASE_PATH: /digital-garden
      - run: python check_site.py dist --base-path /digital-garden
