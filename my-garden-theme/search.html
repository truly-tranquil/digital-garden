{% extends "main.html" %}

{% block content %}
<h1>search</h1>
<p id="search-count" role="status" aria-live="polite"></p>
<div class="search-results" id="search-results"><p>searching the garden…</p></div>
{% endblock %}

{% block extra_scripts %}
<script>
  (function () {
    var q = new URLSearchParams(location.search).get('q') || '';
    var box = document.getElementById('search-results');
    var count = document.getElementById('search-count');
    var input = document.getElementById('mkdocs-search-query');
    if (input) input.value = q;
    if (q.trim()) document.title = q + ' | ' + document.title;
    if (!q.trim()) {
      count.textContent = '';
      box.textContent = 'type something into the search bar.';
      return;
    }
    count.textContent = 'searching…';
    gardenSearch(q, 0).then(function (hits) {
      while (box.firstChild) box.removeChild(box.firstChild);
      count.textContent = hits.length + (hits.length === 1 ? ' result' : ' results') + ' for "' + q + '".';
      if (!hits.length) { box.textContent = 'nothing found for "' + q + '".'; return; }
      hits.forEach(function (h) {
        var art = document.createElement('article');
        var h3 = document.createElement('h3');
        var a = document.createElement('a');
        a.href = base_url + '/' + h.url;
        gardenMark(a, h.title, h.terms);
        h3.appendChild(a);
        var p = document.createElement('p');
        gardenMark(p, h.snippet + (h.snippet.length >= 100 ? '…' : ''), h.terms);
        art.appendChild(h3); art.appendChild(p);
        box.appendChild(art);
      });
    }).catch(function () {
      count.textContent = 'search is temporarily unavailable.';
      box.textContent = 'search is temporarily unavailable. please try again later.';
    });
  })();
</script>
{% endblock %}
