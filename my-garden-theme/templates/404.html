{% extends "base.html" %}
{% block content %}
<article class="garden-article">
    <div class="lost">
        <h1>404</h1>
        <p>this plot hasn't been planted yet, or the note moved.</p>
        <div class="actions">
            <a class="random-btn" href="/">back home</a>
            <a class="random-btn" href="/graph.html">see the graph</a>
        </div>
        <div class="lost-stages">
            <p class="meta-label">or wander into</p>
            {% for stage in random_stages %}
            <a class="link-chip stage-{{ stage.stage }}" href="{{ stage.url }}">{{ stage.label }}</a>
            {% endfor %}
        </div>
    </div>
</article>
{% endblock %}
