{% extends "base.html" %}
{% block content %}
<article class="garden-article">
    <div class="lost">
        <h1>404</h1>
        <p>this plot hasn't been planted yet, or the note moved.</p>
        <form class="lost-search" action="/search/index.html" method="get" role="search">
            <label class="sr-only" for="lost-query">search the garden</label>
            <input id="lost-query" name="q" type="search" placeholder="search for it instead">
            <button class="random-btn" type="submit">search</button>
        </form>
        <div class="actions">
            <a class="random-btn" href="/">back home</a>
            <a class="random-btn" href="/graph.html">see the graph</a>
        </div>
        <div class="lost-stages">
            <p class="meta-label">or wander into</p>
            {% for stage in random_stages %}
            <a class="link-chip stage-{{ stage.stage }}" href="{{ stage.url }}">{{ stage.label }}</a>
            {% endfor %}
        </div>
    </div>
</article>
{% endblock %}
