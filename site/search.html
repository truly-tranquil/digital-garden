  <button id="to-top" type="button" hidden><span aria-hidden="true">↑</span> top<span class="sr-only"> of page</span></button>

  <script>
    var base_url = '.';

    // sidebar (starts closed on small screens)
    var layout = document.getElementById('garden-layout');
    var toggle = document.getElementById('sidebar-toggle');
    function syncToggle() {
      toggle.setAttribute('aria-expanded', String(!layout.classList.contains('sidebar-collapsed')));
    }
    if (window.innerWidth < 800) layout.classList.add('sidebar-collapsed');
    syncToggle();
    toggle.addEventListener('click', function () {
      layout.classList.toggle('sidebar-collapsed');
      syncToggle();
    });

    // light / dark
    var modeBtn = document.getElementById('mode-toggle');
    modeBtn.setAttribute('aria-pressed', String(document.documentElement.dataset.theme === 'dark'));
    modeBtn.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      modeBtn.setAttribute('aria-pressed', String(next === 'dark'));
      try { localStorage.setItem('theme', next); } catch (e) {}
    });

    // random note (any element with data-random)
    document.querySelectorAll('[data-random]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        fetch(base_url + '/notes.json').then(function (r) { return r.json(); }).then(function (all) {
          var pool = all.filter(function (n) { return !n.is_index; });
          if (!pool.length) pool = all;
          var here = location.pathname;
          var choices = pool.filter(function (n) { return !here.endsWith('/' + n.url) && n.url !== ''; });
          if (!choices.length) choices = pool;
          var n = choices[Math.floor(Math.random() * choices.length)];
          location.href = base_url + '/' + n.url;
        });
      });
    });

    // rainbow footnotes and backlinks
    function rainbow(i) { return 'var(--rbt-' + (i % 8) + ')'; }
    document.querySelectorAll('.footnote-ref').forEach(function (a) {
      var n = parseInt(a.textContent, 10);
      if (!n) return;
      a.style.color = rainbow(n - 1);
      var li = document.getElementById(a.getAttribute('href').slice(1));
      if (li) li.style.setProperty('--fnc', rainbow(n - 1));
    });
    document.querySelectorAll('.backlinks li').forEach(function (li, i) {
      li.style.setProperty('--fnc', rainbow(i));
    });

    // reading time
    (function () {
      var el = document.getElementById('reading-time');
      var art = document.querySelector('.garden-article');
      if (!el || !art) return;
      var words = art.innerText.trim().split(/\s+/).length;
      if (words < 40) { el.remove(); return; }
      el.textContent = Math.max(1, Math.round(words / 200)) + ' min read';
    })();

    // press / to jump to search
    document.addEventListener('keydown', function (e) {
      if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target, tag = t && t.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
      var box = document.getElementById('mkdocs-search-query');
      if (!box) return;
      e.preventDefault();
      box.focus();
      box.select();
    });

    // back to top
    (function () {
      var btn = document.getElementById('to-top');
      if (!btn) return;
      function show() { btn.hidden = window.scrollY < 600; }
      window.addEventListener('scroll', show, { passive: true });
      show();
      btn.addEventListener('click', function () {
        var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
        document.getElementById('main-content').focus({ preventScroll: true });
      });
    })();

    // on this page: open on wide screens, highlight the current section
    (function () {
      var toc = document.getElementById('toc');
      if (!toc) return;
      if (window.innerWidth >= 1300) toc.open = true;
      var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
      var map = {};
      links.forEach(function (a) { map[decodeURIComponent(a.getAttribute('href').slice(1))] = a; });
      var heads = Object.keys(map).map(function (id) { return document.getElementById(id); }).filter(Boolean);
      function spy() {
        var current = null;
        heads.forEach(function (h) { if (h.getBoundingClientRect().top <= 120) current = h.id; });
        links.forEach(function (a) { a.classList.remove('current'); a.removeAttribute('aria-current'); });
        if (current && map[current]) {
          map[current].classList.add('current');
          map[current].setAttribute('aria-current', 'true');
        }
      }
      window.addEventListener('scroll', spy, { passive: true });
      spy();
    })();

    // copy buttons on code blocks
    (function () {
      var live = document.createElement('div');
      live.className = 'sr-only';
      live.setAttribute('role', 'status');
      live.setAttribute('aria-live', 'polite');
      document.body.appendChild(live);
      document.querySelectorAll('.garden-article pre:not(.mermaid)').forEach(function (pre) {
        var host = pre.parentElement;
        if (!host.classList.contains('highlight')) {
          host = document.createElement('div');
          host.className = 'code-wrap';
          pre.replaceWith(host);
          host.appendChild(pre);
        }
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-btn';
        btn.textContent = 'copy';
        btn.addEventListener('click', function () {
          if (!navigator.clipboard) { btn.textContent = 'unavailable'; return; }
          navigator.clipboard.writeText(pre.textContent.replace(/\n$/, '')).then(function () {
            btn.textContent = 'copied';
            live.textContent = 'copied to clipboard';
            setTimeout(function () { btn.textContent = 'copy'; live.textContent = ''; }, 1800);
          }).catch(function () { btn.textContent = 'failed'; });
        });
        host.appendChild(btn);
      });
    })();

    // favicons on external links (uses Google's favicon service)
    document.querySelectorAll('.garden-article a[href^="http"]').forEach(function (a) {
      try {
        var u = new URL(a.href);
        if (u.host === location.host || a.querySelector('img')) return;
        var img = document.createElement('img');
        img.className = 'link-favicon';
        img.alt = '';
        img.src = 'https://www.google.com/s2/favicons?sz=32&domain=' + u.hostname;
        a.prepend(img);
      } catch (e) {}
    });
  </script>
  <script src="./garden-search.js"></script>
  <script src="./garden-mermaid.js"></script>
  
<script>
  (function () {
    var q = new URLSearchParams(location.search).get('q') || '';
    var box = document.getElementById('search-results');
    var input = document.getElementById('mkdocs-search-query');
    if (input) input.value = q;
    if (!q.trim()) { box.textContent = 'type something into the search bar.'; return; }
    gardenSearch(q, 0).then(function (hits) {
      box.innerHTML = '';
      if (!hits.length) { box.textContent = 'nothing found for "' + q + '".'; return; }
      hits.forEach(function (h) {
        var art = document.createElement('article');
        var h3 = document.createElement('h3');
        var a = document.createElement('a');
        a.href = base_url + '/' + h.url; a.textContent = h.title;
        h3.appendChild(a);
        var p = document.createElement('p'); p.textContent = h.snippet + '…';
        art.appendChild(h3); art.appendChild(p);
        box.appendChild(art);
      });
    });
  })();
</script>
