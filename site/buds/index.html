  <script>
    var base_url = '..';

    // sidebar (hidden by default on small screens, remembered on large ones)
    var layout = document.getElementById('garden-layout');
    var toggle = document.getElementById('sidebar-toggle');
    var narrow = matchMedia('(max-width: 800px)');
    function sidebarIsOpen() {
      return narrow.matches ? layout.classList.contains('sidebar-open') : !layout.classList.contains('sidebar-collapsed');
    }
    function syncToggle() {
      toggle.setAttribute('aria-expanded', String(sidebarIsOpen()));
    }
    try { if (localStorage.getItem('sidebar') === 'closed') layout.classList.add('sidebar-collapsed'); } catch (e) {}
    syncToggle();
    toggle.addEventListener('click', function () {
      if (narrow.matches) {
        layout.classList.toggle('sidebar-open');
      } else {
        layout.classList.toggle('sidebar-collapsed');
        try { localStorage.setItem('sidebar', layout.classList.contains('sidebar-collapsed') ? 'closed' : 'open'); } catch (e) {}
      }
      syncToggle();
    });
    narrow.addEventListener('change', syncToggle);

    // light / dark
    var modeBtn = document.getElementById('mode-toggle');
    var systemDark = matchMedia('(prefers-color-scheme: dark)');
    function setTheme(t) {
      document.documentElement.dataset.theme = t;
      modeBtn.setAttribute('aria-pressed', String(t === 'dark'));
    }
    modeBtn.setAttribute('aria-pressed', String(document.documentElement.dataset.theme === 'dark'));
    modeBtn.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    systemDark.addEventListener('change', function (e) {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (err) {}
      if (!saved) setTheme(e.matches ? 'dark' : 'light');
    });

    // random note (any element with data-random)
    document.querySelectorAll('[data-random]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        fetch(base_url + '/notes.json').then(function (r) { return r.json(); }).then(function (all) {
          var pool = all.filter(function (n) { return !n.is_index; });
          if (!pool.length) pool = all;
          var here = location.pathname;
          var choices = pool.filter(function (n) { return !here.endsWith('/' + n.url) && n.url !== ''; });
          if (!choices.length) choices = pool;
          var n = choices[Math.floor(Math.random() * choices.length)];
          location.href = base_url + '/' + n.url;
        });
      });
    });

    // rainbow footnotes and backlinks
    function rainbow(i) { return 'var(--rbt-' + (i % 8) + ')'; }
    document.querySelectorAll('.footnote-ref').forEach(function (a) {
      var n = parseInt(a.textContent, 10);
      if (!n) return;
      a.style.color = rainbow(n - 1);
      var li = document.getElementById(a.getAttribute('href').slice(1));
      if (li) li.style.setProperty('--fnc', rainbow(n - 1));
    });
    document.querySelectorAll('.backlinks li').forEach(function (li, i) {
      li.style.setProperty('--fnc', rainbow(i));
    });

    // reading time
    (function () {
      var el = document.getElementById('reading-time');
      var art = document.querySelector('.garden-article');
      if (!el || !art) return;
      var words = art.innerText.trim().split(/\s+/).length;
      if (words < 40) { el.remove(); return; }
      el.textContent = Math.max(1, Math.round(words / 200)) + ' min read';
    })();

    // press / to jump to search
    document.addEventListener('keydown', function (e) {
      if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target, tag = t && t.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
      var box = document.getElementById('mkdocs-search-query');
      if (!box) return;
      e.preventDefault();
      box.focus();
      box.select();
    });

    // back to top
    (function () {
      var btn = document.getElementById('to-top');
      if (!btn) return;
      function show() { btn.hidden = window.scrollY < 600; }
      window.addEventListener('scroll', show, { passive: true });
      show();
      btn.addEventListener('click', function () {
        var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
        document.getElementById('main-content').focus({ preventScroll: true });
      });
    })();

    // on this page drawer
    (function () {
      var drawer = document.getElementById('toc-drawer');
      if (!drawer) return;
      var toc = document.getElementById('toc');
      var headings = Array.prototype.slice.call(
        document.querySelectorAll('.garden-article h2[id], .garden-article h3[id], .garden-article h4[id], .garden-article h5[id], .garden-article h6[id]')
      );
      if (!headings.length) {
        drawer.hidden = true;
        return;
      }
      var list = document.createElement('ul');
      headings.forEach(function (heading) {
        var item = document.createElement('li');
        var link = document.createElement('a');
        var label = heading.cloneNode(true);
        label.querySelectorAll('.headerlink').forEach(function (permalink) {
          permalink.remove();
        });
        link.href = '#' + encodeURIComponent(heading.id);
        link.textContent = label.textContent.trim();
        item.appendChild(link);
        list.appendChild(item);
      });
      toc.appendChild(list);
      layout.classList.add('has-toc');

      var btn = document.getElementById('toc-toggle');
      var panel = document.getElementById('toc-panel');
      var wide = matchMedia('(min-width: 1100px)');
      function tocIsOpen() {
        return wide.matches ? !layout.classList.contains('toc-collapsed') : layout.classList.contains('toc-open');
      }
      function syncToc() {
        btn.setAttribute('aria-expanded', String(tocIsOpen()));
      }
      try { if (localStorage.getItem('toc') === 'closed') layout.classList.add('toc-collapsed'); } catch (e) {}
      syncToc();
      btn.addEventListener('click', function () {
        if (wide.matches) {
          layout.classList.toggle('toc-collapsed');
          try { localStorage.setItem('toc', layout.classList.contains('toc-collapsed') ? 'closed' : 'open'); } catch (e) {}
        } else {
          layout.classList.toggle('toc-open');
        }
        syncToc();
      });
      wide.addEventListener('change', syncToc);
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape' || wide.matches || !layout.classList.contains('toc-open')) return;
        layout.classList.remove('toc-open');
        syncToc();
        btn.focus();
      });
      panel.addEventListener('click', function (e) {
        if (wide.matches || !e.target.closest('a')) return;
        layout.classList.remove('toc-open');
        syncToc();
      });
    })();

    // on this page: highlight the current section
    (function () {
      var toc = document.getElementById('toc');
      if (!toc) return;
      var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
      var map = {};
      links.forEach(function (a) { map[decodeURIComponent(a.getAttribute('href').slice(1))] = a; });
      var heads = Object.keys(map).map(function (id) { return document.getElementById(id); }).filter(Boolean);
      function spy() {
        var current = null;
        heads.forEach(function (h) { if (h.getBoundingClientRect().top <= 120) current = h.id; });
        links.forEach(function (a) { a.classList.remove('current'); a.removeAttribute('aria-current'); });
        if (current && map[current]) {
          map[current].classList.add('current');
          map[current].setAttribute('aria-current', 'true');
        }
      }
      window.addEventListener('scroll', spy, { passive: true });
      spy();
    })();

    // tables and code blocks that scroll sideways become keyboard focusable
    var scrollers = [];
    function trackScroller(el, label) {
      scrollers.push({ el: el, label: label });
    }
    function checkScrollers() {
      scrollers.forEach(function (s) {
        if (s.el.scrollWidth > s.el.clientWidth) {
          s.el.tabIndex = 0;
          s.el.setAttribute('role', 'region');
          s.el.setAttribute('aria-label', s.label);
        } else {
          s.el.removeAttribute('tabindex');
          s.el.removeAttribute('role');
          s.el.removeAttribute('aria-label');
        }
      });
    }

    // wrap tables so they scroll without losing table semantics
    document.querySelectorAll('.garden-article table').forEach(function (t) {
      if (t.parentElement.classList.contains('table-wrap')) return;
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.replaceWith(wrap);
      wrap.appendChild(t);
      trackScroller(wrap, 'scrollable table');
    });

    // copy buttons on code blocks
    (function () {
      var live = document.createElement('div');
      live.className = 'sr-only';
      live.setAttribute('role', 'status');
      live.setAttribute('aria-live', 'polite');
      document.body.appendChild(live);
      document.querySelectorAll('.garden-article pre:not(.mermaid)').forEach(function (pre) {
        var host = pre.parentElement;
        if (!host.classList.contains('highlight')) {
          host = document.createElement('div');
          host.className = 'code-wrap';
          pre.replaceWith(host);
          host.appendChild(pre);
        }
        trackScroller(pre, 'code');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-btn';
        btn.textContent = 'copy';
        btn.addEventListener('click', function () {
          if (!navigator.clipboard) { btn.textContent = 'unavailable'; return; }
          navigator.clipboard.writeText(pre.textContent.replace(/\n$/, '')).then(function () {
            btn.textContent = 'copied';
            live.textContent = 'copied to clipboard';
            setTimeout(function () { btn.textContent = 'copy'; live.textContent = ''; }, 1800);
          }).catch(function () { btn.textContent = 'failed'; });
        });
        host.appendChild(btn);
      });
    })();

    checkScrollers();
    window.addEventListener('resize', checkScrollers);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(checkScrollers);

    // favicons on external links (uses Google's favicon service)
    document.querySelectorAll('.garden-article a[href^="http"]').forEach(function (a) {
      try {
        var u = new URL(a.href);
        if (u.host === location.host || a.querySelector('img')) return;
        var img = document.createElement('img');
        img.className = 'link-favicon';
        img.alt = '';
        img.src = 'https://www.google.com/s2/favicons?sz=32&domain=' + u.hostname;
        a.prepend(img);
      } catch (e) {}
    });
  </script>
